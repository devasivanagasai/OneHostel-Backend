# Local development. Defaults point at a local MongoDB without credentials and
# the Angular dev server; override any of them with environment variables.
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/onehostel}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    # Publicly known dev-only key. Tokens signed with it must never be trusted outside dev.
    secret: ${JWT_SECRET:b25laG9zdGVsLWRldi1vbmx5LWp3dC1zZWNyZXQtZG8tbm90LXVzZS1pbi1wcm9kISE=}
  bootstrap:
    # Dev-only super admin, created at startup if missing. Publicly known: never use these
    # values outside dev. Override any of them with the matching environment variable.
    admin-name: ${ADMIN_NAME:OneHostel Super Admin}
    admin-email: ${ADMIN_EMAIL:admin@onehostel.com}
    admin-username: ${ADMIN_USERNAME:superadmin}
    admin-password: ${ADMIN_PASSWORD:Admin@OneHostel2026}
    admin-passcode: ${ADMIN_PASSCODE:246810}
    # Demo hostel owner and tenant (see UserSeeder). Set SEED_DEMO_USERS=false to skip.
    demo-users: ${SEED_DEMO_USERS:true}

logging:
  level:
    com.onehostel: DEBUG
