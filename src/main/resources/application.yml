# Shared settings for every profile. Secrets are NEVER written here — they come
# from environment variables (see README.md, "Environment variables").
server:
  port: ${SERVER_PORT:8080}
  error:
    # Our GlobalExceptionHandler builds every error body; never leak stack traces.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: onehostel-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    # Base64 of at least 32 random bytes, e.g. `openssl rand -base64 48`.
    secret: ${JWT_SECRET}
    # Access token lifetime; renewed with the refresh token (HttpOnly cookie).
    expiration: ${JWT_EXPIRATION:15m}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}
    issuer: onehostel
  bootstrap:
    # First admin account, created at startup if missing. Leave unset to skip.
    admin-name: ${ADMIN_NAME:Administrator}
    admin-email: ${ADMIN_EMAIL:}
    # Optional login name for the first admin, as an alternative to the email.
    admin-username: ${ADMIN_USERNAME:}
    admin-password: ${ADMIN_PASSWORD:}
    # Optional 6-digit passcode for the first admin (alternative to the password).
    admin-passcode: ${ADMIN_PASSCODE:}
    demo-users: false
  rate-limit:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    # Every log line carries the request's correlation id (set by CorrelationIdFilter).
    level: "%5p [%X{correlationId:-}]"
  level:
    com.onehostel: INFO
